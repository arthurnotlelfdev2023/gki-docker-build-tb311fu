name: Build GKI 5.10 with Docker & KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libncurses5-dev libssl-dev libxml2-utils xsltproc libreadline-dev repo python3

      - name: Setup Repo and Clone GKI 5.10
        run: |
          mkdir android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android15-lts --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Integrate KernelSU-Next
        run: |
          cd android-kernel/common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Append Docker Configurations
        run: |
          cat <<EOT >> android-kernel/common/arch/arm64/configs/gki_defconfig
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_USER_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CPUSETS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_BLK_CGROUP=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_POSIX_MQUEUE=y
          EOT

      - name: Normalize Defconfig & Compile Kernel
        run: |
          cd android-kernel
          
          # 1. Alisin ang check_defconfig call sa build config
          sed -i 's/POST_DEFCONFIG_CMDS="check_defconfig"/POST_DEFCONFIG_CMDS=""/g' common/build.config.gki
          
          # 2. Simulan ang compilation
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          KMI_SYMBOL_LIST_STRICT_MODE=0 \
          KMI_ENFORCED=0 \
          LTO=thin \
          BUILD_AOSP_KERNEL=1 \
          ./build/build.sh

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/WildKernels/AnyKernel3.git -b gki-2.0
          cp android-kernel/out/android12-5.10/dist/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../AnyKernel3-GKI-Docker-5.10.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-5.10-Docker-Kernel
          path: AnyKernel3-GKI-Docker-5.10.zip
